data:
  cache: ./data/md300/prepared_targetdiff_md300_10frames.pt
  train_split: train
  valid_split: valid

model:
  model_mean_type: C0
  beta_schedule: sigmoid
  beta_start: 1.e-7
  beta_end: 2.e-3
  v_beta_schedule: cosine
  v_beta_s: 0.01
  num_diffusion_timesteps: 1000
  loss_v_weight: 100.
  sample_time_method: symmetric

  time_emb_dim: 0
  time_emb_mode: simple
  center_pos_mode: protein
  node_indicator: True
  model_type: uni_o2
  num_blocks: 1
  num_layers: 9
  hidden_dim: 128
  n_heads: 16
  edge_feat_dim: 4
  num_r_gaussian: 20
  knn: 32
  num_node_types: 8
  act_fn: relu
  norm: True
  cutoff_mode: knn
  ew_net_type: global
  num_x2h: 1
  num_h2x: 1
  r_max: 10.
  x2h_out_fc: False
  sync_twoup: False

  aplc_enabled: True
  aplc_k: 16
  aplc_num_r_gaussian: 16
  aplc_layerwise_layers: 3

train:
  seed: 2021
  batch_size: 2
  num_workers: 2
  pos_noise_std: 0.1
  max_grad_norm: 8.0
  val_every: 50
  val_time_steps: [0, 111, 222, 333, 444, 555, 666, 777, 888, 999]

  stage1:
    max_iters: 1000
    lr: 1.e-4
    weight_decay: 0.

  stage2:
    max_iters: 3000
    lr: 2.e-5
    weight_decay: 0.
    tail_layers: 2
